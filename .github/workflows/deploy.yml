name: Build & Deploy

on:
  push:
    branches: [main, master]
  workflow_run:
    workflows: ["Tests & Type Check"]
    types: [completed]
    branches: [main, master]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  build-docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    continue-on-error: true
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository owner
        id: repo
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
      
      - name: Extract version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner_lc }}/finmindai:latest
            ghcr.io/${{ steps.repo.outputs.owner_lc }}/finmindai:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      deployments: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Verify Vercel token and project access
        shell: bash
        run: |
          set -euo pipefail
          vercel whoami --token="$VERCEL_TOKEN"
          curl -sS -f \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            >/dev/null

      - name: Reset Vercel project link state
        run: rm -rf .vercel
      
      - name: Pull Vercel environment
        shell: bash
        run: |
          set -euo pipefail
          SCOPE_ARGS=""
          if [ -n "${VERCEL_SCOPE:-}" ]; then
            SCOPE_ARGS="--scope=$VERCEL_SCOPE"
          fi
          vercel pull --yes --environment=production $SCOPE_ARGS --token="$VERCEL_TOKEN"

      - name: Build with Vercel
        shell: bash
        run: |
          set -euo pipefail
          SCOPE_ARGS=""
          if [ -n "${VERCEL_SCOPE:-}" ]; then
            SCOPE_ARGS="--scope=$VERCEL_SCOPE"
          fi
          vercel build --prod --yes $SCOPE_ARGS --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        shell: bash
        run: |
          set -euo pipefail
          SCOPE_ARGS=""
          if [ -n "${VERCEL_SCOPE:-}" ]; then
            SCOPE_ARGS="--scope=$VERCEL_SCOPE"
          fi
          vercel deploy --prebuilt --prod --yes $SCOPE_ARGS --token="$VERCEL_TOKEN"
      
