name: Build & Deploy

on:
  push:
    branches: [main, master]
  workflow_run:
    workflows: ["Tests & Type Check"]
    types: [completed]
    branches: [main, master]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  build-docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    continue-on-error: true
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository owner
        id: repo
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
      
      - name: Extract version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner_lc }}/finmindai:latest
            ghcr.io/${{ steps.repo.outputs.owner_lc }}/finmindai:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      deployments: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
      VERCEL_PROJECT_NAME: ${{ github.event.repository.name }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Prepare Vercel context
        shell: bash
        run: |
          set -euo pipefail
          VERCEL_TOKEN_CLEAN="$(printf %s "$VERCEL_TOKEN" | tr -d '\r\n')"
          VERCEL_ORG_ID_CLEAN="$(printf %s "$VERCEL_ORG_ID" | tr -d '\r\n')"
          VERCEL_PROJECT_ID_CLEAN="$(printf %s "$VERCEL_PROJECT_ID" | tr -d '\r\n')"
          VERCEL_SCOPE_CLEAN="$(printf %s "${VERCEL_SCOPE:-}" | tr -d '\r\n')"

          if [ -z "$VERCEL_SCOPE_CLEAN" ]; then
            VERCEL_SCOPE_CLEAN="${GITHUB_REPOSITORY_OWNER,,}"
          fi

          if [ -z "$VERCEL_ORG_ID_CLEAN" ] || [ -z "$VERCEL_PROJECT_ID_CLEAN" ]; then
            echo "VERCEL_ORG_ID and VERCEL_PROJECT_ID must both be set in GitHub secrets."
            exit 1
          fi

          echo "VERCEL_TOKEN=$VERCEL_TOKEN_CLEAN" >> "$GITHUB_ENV"
          echo "VERCEL_ORG_ID=$VERCEL_ORG_ID_CLEAN" >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID_CLEAN" >> "$GITHUB_ENV"
          echo "VERCEL_SCOPE=$VERCEL_SCOPE_CLEAN" >> "$GITHUB_ENV"

          vercel whoami --token="$VERCEL_TOKEN_CLEAN"

      - name: Reset Vercel project link state
        run: rm -rf .vercel
      
      - name: Pull Vercel environment
        shell: bash
        run: |
          set -euo pipefail
          if vercel pull --yes --environment=production --token="$VERCEL_TOKEN"; then
            echo "USE_SCOPE_ARGS=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "ID-based pull failed. Falling back to scope/project link mode..."
          unset VERCEL_ORG_ID
          unset VERCEL_PROJECT_ID

          vercel link --yes --project="$VERCEL_PROJECT_NAME" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
          vercel pull --yes --environment=production --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
          echo "USE_SCOPE_ARGS=true" >> "$GITHUB_ENV"

      - name: Build with Vercel
        shell: bash
        run: |
          set -euo pipefail
          if [ "${USE_SCOPE_ARGS:-false}" = "true" ]; then
            vercel build --prod --yes --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
          else
            vercel build --prod --yes --token="$VERCEL_TOKEN"
          fi

      - name: Deploy to Vercel
        shell: bash
        run: |
          set -euo pipefail
          if [ "${USE_SCOPE_ARGS:-false}" = "true" ]; then
            vercel deploy --prebuilt --prod --yes --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
          else
            vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
          fi
      
